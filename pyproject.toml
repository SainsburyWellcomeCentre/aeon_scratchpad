[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-qc"
version = "0.1.0"
requires-python = ">=3.11"
description = "Data quality control metrics for Project Aeon datasets."
license = "BSD-3-Clause"
dependencies = [
  # aeon_api main, pinned to a commit, because these are not in the 0.2.0 release yet:
  #   load(sort=False): https://github.com/SainsburyWellcomeCentre/aeon_api/pull/91
  #   Binary reader:    https://github.com/SainsburyWellcomeCentre/aeon_api/pull/94
  # Replace with a PyPI requirement (swc-aeon>=<next release>) once aeon_api releases
  # them, and revisit when swc.aeon.qc lands:
  #   https://github.com/SainsburyWellcomeCentre/aeon_api/pull/86
  "swc-aeon @ git+https://github.com/SainsburyWellcomeCentre/aeon_api.git@63fb47d661e11f978dedfe671c94c490100ce594",
  "pyyaml",
  "numpy>=1.26.4",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pandas-stubs",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "ruff",
  "pyright",
  "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
lint.select = [
  "E",
  "W",
  "F",
  "I",
  "D",
  "UP",
  "S",
  "B",
  "A",
  "C4",
  "ICN",
  "PIE",
  "PT",
  "SIM",
  "PL",
]
lint.ignore = [
  "E731",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]
line-length = 108
extend-exclude = [
  ".git",
  ".github",
  ".idea",
  "*.ipynb",
  ".vscode",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D103",    # skip adding docstrings for public functions
  "D205",    # skip checking for blank line between summary and description
  "S101",    # skip using assert
  "PLR2004", # skip checking for "magic" values
]
"src/aeon_qc/octagon.py"  = ["D101", "D106", "D107"]
"src/aeon_qc/social.py"   = ["D107", "D401"]
"src/aeon_qc/foraging.py" = ["D101", "D107"]
"src/aeon_qc/ephys.py"    = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pyright]
useLibraryCodeForTypes = false
reportMissingImports = "none"
reportImportCycles = "error"
reportUnusedImport = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportPrivateUsage = "error"
reportCallInDefaultInitializer = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportUnusedExpression = "error"
reportMatchNotExhaustive = "error"
# *Note*: we may want to set all 'ReportOptional*' rules to "none", but leaving 'em default for now
venvPath = "."
venv = ".venv"
exclude = [".venv/*"]

[tool.pytest.ini_options]
markers = ["api"]
pythonpath = ["src"]
addopts = [
  "--cov=src/aeon_qc"
]
